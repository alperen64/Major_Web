<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Major Pub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff; 
            --text-muted: #dcdcdc; 
            --vintage-red: #cc0000; 
            --vintage-red-hover: #ff1a1a;
            --green: #2e8b57;
            --border-radius: 15px; 
            --glass-bg: rgba(30, 30, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; font-weight: 700; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            line-height: 1.6; position: relative; overflow-x: hidden; min-height: 100vh;
        }

        /* Daha Görünür Kırmızı Sahne Işıkları */
        body::before {
            content: ''; position: fixed; top: -150px; left: -150px; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(204,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
            filter: blur(50px); z-index: -1; pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; bottom: -150px; right: -150px; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(204,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
            filter: blur(50px); z-index: -1; pointer-events: none;
        }
        
        /* HİZALANMIŞ HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 90px;
            z-index: 1000; pointer-events: none;
        }
        .logo-image {
            position: absolute; top: 50%; left: 30px; transform: translateY(-50%);
            width: 70px; height: 70px; border-radius: 50%; cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            object-fit: contain; background-color: #000; pointer-events: auto;
        }
        .logo-image:hover { transform: translateY(-50%) scale(1.1); box-shadow: 0 10px 20px rgba(204, 0, 0, 0.5); }

        .floating-nav {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; gap: 15px; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 10px 25px; border-radius: 50px; border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .nav-btn { 
            background: none; border: none; color: var(--text-muted); font-size: 15px; 
            cursor: pointer; padding: 8px 16px; border-radius: 30px; transition: all 0.3s; 
        }
        .nav-btn:hover, .nav-btn.active { 
            background-color: rgba(204, 0, 0, 0.8); color: white; box-shadow: 0 0 10px rgba(204, 0, 0, 0.5);
        }

        /* HEADER SAĞ BÖLÜM (Sosyal & Dil) */
        .header-right {
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 20px; pointer-events: auto;
        }
        .social-icons { display: flex; gap: 12px; }
        .social-icons a, .social-icons span {
            color: var(--text-muted); cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .social-icons a:hover, .social-icons span:hover {
            color: white; transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
        }

        /* KAYAN ANİMASYONLU DİL SEÇİCİ */
        .lang-switcher {
            position: relative; display: flex; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 4px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .lang-slider {
            position: absolute; top: 4px; left: 4px; width: 32px; height: calc(100% - 8px);
            background: var(--vintage-red); border-radius: 20px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 0; box-shadow: 0 0 10px rgba(204, 0, 0, 0.6);
        }
        .lang-opt {
            position: relative; z-index: 1; width: 32px; text-align: center; font-size: 11px; font-weight: 800;
            color: var(--text-muted); line-height: 22px; cursor: pointer; transition: color 0.3s; user-select: none;
        }
        .lang-opt.active { color: white; }
        
        .container { max-width: 1100px; margin: 120px auto 30px; padding: 20px; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* BUTONLAR VE İNPUTLAR */
        .btn { padding: 12px 24px; border: none; border-radius: var(--border-radius); cursor: pointer; font-size: 14px; transition: 0.3s; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: var(--vintage-red); }
        .btn-primary:hover { background-color: var(--vintage-red-hover); box-shadow: 0 0 10px var(--vintage-red-hover); }
        .btn-green { background-color: var(--green); }
        .btn-green:hover { background-color: #3cb371; }
        .btn-admin { background-color: #333; }
        .btn-admin:hover { background-color: #444; }
        .btn-danger { background-color: #990000; }
        .btn-danger:hover { background-color: #cc0000; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; 
            border-radius: 12px; border: 1px solid #333; background-color: rgba(0,0,0,0.5); 
            color: white; outline: none; backdrop-filter: blur(5px); font-family: 'Poppins', sans-serif;
        }
        input:focus, textarea:focus { border-color: var(--vintage-red); box-shadow: 0 0 8px rgba(204,0,0,0.5); }
        
        .admin-only { display: none; border: 1px dashed var(--vintage-red); padding: 20px; border-radius: var(--border-radius); margin-bottom: 25px; background-color: rgba(139, 0, 0, 0.1); backdrop-filter: blur(5px); }

        .category-container { display: flex; gap: 10px; overflow-x: auto; padding: 12px 20px; margin-bottom: 30px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border-radius: 50px; border: 1px solid var(--glass-border); justify-content: center; }
        .menu-tab { background: transparent; color: var(--text-muted); padding: 8px 18px; border-radius: 30px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 14px; border: none; }
        .menu-tab:hover { color: white; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .menu-tab.active { background-color: var(--vintage-red); color: white; box-shadow: 0 0 10px var(--vintage-red); }
        
        .glass-item-card { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .glass-item-card:hover { border-color: rgba(204,0,0,0.4); transform: translateX(5px); box-shadow: 0 5px 15px rgba(204,0,0,0.2); }
        
        .grid-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .event-card-home { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: var(--border-radius); padding: 20px; transition: all 0.3s; cursor: pointer; }
        .event-card-home:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(204, 0, 0, 0.4); border-color: var(--vintage-red); }

        /* Takvim */
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 20px; }
        .cal-day { aspect-ratio: 1; border-radius: 15px; position: relative; overflow: hidden; background: #111; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .cal-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; background-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.3) 100%); transition: 0.3s; z-index: 1; }
        .cal-day:hover { transform: translateY(-8px); border-color: var(--vintage-red); box-shadow: 0 0 20px rgba(204, 0, 0, 0.7); }
        .cal-day:hover .cal-bg { transform: scale(1.1); }
        .day-num { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 8px; border-radius: 8px; font-size: 14px; z-index: 2; border: 1px solid #333; }
        
        /* SİSTEM TASARIMI İLE UYUMLU ÖZEL POP-UP (MODAL) ALTYAPISI */
        .sys-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .sys-modal-content {
            background: #111; border: 1px solid var(--vintage-red); border-radius: 25px; padding: 30px; 
            width: 90%; max-width: 450px; text-align: center; position: relative; 
            box-shadow: 0 0 40px rgba(204,0,0,0.4); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .sys-close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer; }
        .sys-close-modal:hover { color: white; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        /* FOOTER (ALT BİLGİ) STİLLERİ */
        .site-footer {
            max-width: 1100px; margin: 60px auto 20px auto; padding: 0 20px;
            text-align: center; clear: both;
        }
        .site-footer hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px; }
        .site-footer p { color: #777777; font-size: 12px; font-weight: 400; letter-spacing: 0.5px; }

       /* =========================================
           MOBİL UYUM (RESPONSIVE DESIGN) EKLENTİLERİ
           ========================================= */
        @media screen and (max-width: 768px) {
            header {
                display: flex; flex-direction: column; justify-content: flex-end;
                height: auto; padding: 15px; background: rgba(5, 5, 5, 0.95); 
                backdrop-filter: blur(10px); pointer-events: auto;
            }
            .logo-image { position: absolute; top: 15px; left: 15px; transform: none; width: 40px; height: 40px; margin: 0; }
            .header-right { position: absolute; top: 18px; right: 15px; transform: none; gap: 12px; }
            .social-icons svg { width: 18px; height: 18px; }

            .floating-nav {
                position: relative; transform: none; left: 0; top: 0; width: 100%; background: transparent;
                border: none; box-shadow: none; padding: 0; gap: 5px; margin-top: 45px; 
                justify-content: center; flex-wrap: wrap;
            }
            .nav-btn { font-size: 11px; padding: 6px 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); white-space: nowrap; flex: 1 1 auto; text-align: center; }
            .container { margin-top: 130px; padding: 15px; }

            #home h1 { font-size: 28px !important; margin-top: 0; }
            #home h3 { font-size: 22px !important; margin-bottom: 20px; }

            #upcomingEventsGrid {
                display: flex !important; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
                scroll-snap-type: x mandatory; gap: 15px; padding-bottom: 15px; -webkit-overflow-scrolling: touch;
            }
            #upcomingEventsGrid::-webkit-scrollbar { display: none; }
            
            .event-card-home {
                flex: 0 0 200px; height: 200px; display: flex; flex-direction: column;
                scroll-snap-align: start; padding: 12px; margin: 0;
            }
            .event-card-home img { width: 100%; flex: 1; object-fit: cover; border-radius: 10px; margin-bottom: 10px !important; height: 100px !important; }
            .event-card-home h4 { font-size: 14px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .event-card-home p { font-size: 11px !important; margin-top: 2px !important; }

            .category-container { justify-content: flex-start; padding: 10px; border-radius: 20px; }
            .menu-tab { font-size: 12px; padding: 6px 12px; }

            #menuItemsGrid .glass-item-card { flex-direction: row !important; align-items: center !important; padding: 12px; }
            #menuItemsGrid .glass-item-card h3 { font-size: 14px !important; }
            #menuItemsGrid .glass-item-card p { font-size: 11px !important; line-height: 1.3; margin-top: 3px; color: #aaa !important; }
            #menuItemsGrid .glass-item-card > div:last-child { margin-left: 10px !important; margin-top: 0 !important; font-size: 14px !important; }
            #menuItemsGrid .glass-item-card > div:first-child > div { flex-wrap: wrap; }

            #pendingReservations .glass-item-card, #approvedReservations .glass-item-card {
                display: flex !important; flex-direction: column !important; align-items: flex-start !important;
                width: 100% !important; padding: 15px !important; box-sizing: border-box !important;
            }
            #pendingReservations .glass-item-card p, #pendingReservations .glass-item-card h4,
            #approvedReservations .glass-item-card p, #approvedReservations .glass-item-card h4 {
                max-width: 100%; word-wrap: break-word; white-space: normal; 
            }

            #customerResView { flex-direction: column !important; align-items: stretch !important; width: 100% !important; box-sizing: border-box !important; }
            #adminEventControls[style*="block"], #adminMenuControls[style*="block"] {
                display: flex !important; flex-direction: column !important; align-items: stretch !important; width: 100% !important; box-sizing: border-box !important;
            }

            /* İnput Görünümlü Kutular (Tarih Butonu ve Yeni Etkinlik Balonu) - Yan Yana Dizilim Korunsun */
            #customerResView > .glass-item-card, #adminEventControls > .glass-item-card {
                display: flex !important; flex-direction: row !important; justify-content: space-between !important; align-items: center !important;
                width: 100% !important; box-sizing: border-box !important; padding: 12px !important; margin-top: 8px !important; margin-bottom: 15px !important;
                border-radius: 12px !important; border: 1px solid #333 !important; background-color: rgba(0,0,0,0.5) !important; box-shadow: none !important; height: auto;
            }
            #resDate_display, #eventDate_display { font-size: 13.5px !important; font-weight: 400 !important; color: var(--text-muted); }
            
            .calendar-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
            .day-num { font-size: 12px; padding: 2px 6px; }
            .sys-modal-content { width: 95%; padding: 20px; }
            #pickerGrid { gap: 3px !important; }
            #pickerGrid .cal-day { font-size: 12px !important; border-radius: 6px !important; }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDC2uFrKh1BIDvScizUKtO_LtgpxEiheu7rbrKqxu7OQ&s=10" alt="Major Logo" class="logo-image" onclick="handleLogoClick()" ondblclick="handleLogoDblClick()">
        <nav class="floating-nav">
            <button class="nav-btn active" onclick="showSection('home')" data-i18n="nav_home">Ana Sayfa</button>
            <button class="nav-btn" onclick="showSection('menu')" data-i18n="nav_menu">Menü</button>
            <button class="nav-btn" onclick="showSection('events')" data-i18n="nav_events">Etkinlikler</button>
            <button class="nav-btn" onclick="showSection('reservation')" data-i18n="nav_res">Rezervasyon</button>
        </nav>
        <div class="header-right">
            <div class="social-icons">
                <a href="https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=&cad=rja&uact=8&ved=2ahUKEwjsma_MyeOVAxVJgP0HHZe2InQQFnoECDwQAQ&url=https%3A%2F%2Fwww.instagram.com%2Fmajorpub_%2F&usg=AOvVaw33JHirO0TaDKPqpf8z7cee&opi=89978449" target="_blank" title="Instagram">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                <a href="https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=&cad=rja&uact=8&ved=2ahUKEwjsma_MyeOVAxVJgP0HHZe2InQQFnoECDsQAQ&url=https%3A%2F%2Fwww.facebook.com%2Fp%2FMaj%25C3%25B6r-Pub-61560634168531%2F&usg=AOvVaw3m8LZuv2GP65ELmV02PNYs&opi=89978449" target="_blank" title="Facebook">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                </a>
                <span onclick="showContactModal()" title="İletişim">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </span>
            </div>
            <div class="lang-switcher">
                <div class="lang-slider" id="langSlider"></div>
                <span class="lang-opt active" onclick="changeLang(this, 0)">TR</span>
                <span class="lang-opt" onclick="changeLang(this, 1)">EN</span>
                <span class="lang-opt" onclick="changeLang(this, 2)">BG</span>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- ANA SAYFA -->
        <div id="home" class="section active">
            <div style="text-align: center; margin-bottom: 100px; margin-top: 50px;">
                <h1 style="color: #ffffff; font-size: 40px; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,255,255,0.3);">MAJOR PUB</h1>
            </div>
            <h3 style="text-align: center; margin-bottom: 45px; font-size: 40px; color: #ffffff;" data-i18n="title_upcoming">Yaklaşan Etkinlikler</h3>
            <div id="upcomingEventsGrid" class="grid-home"></div>
        </div>

        <!-- MENÜ SEKMESİ -->
        <div id="menu" class="section">
            <div class="admin-only" id="adminMenuControls">
                <h3 style="color: var(--vintage-red); margin-bottom: 15px;" data-i18n="admin_cat_title">[Admin] Kategori ve Ürün Ekle</h3>
                <input type="text" id="newCategoryName" placeholder="Yeni Kategori Adı" data-i18n="cat_ph">
                <button class="btn btn-primary" onclick="addCategory()" data-i18n="btn_add_cat">Kategori Ekle</button>
                <hr style="border-color:#333; margin: 20px 0;">
                <select id="categorySelect"></select>
                <input type="text" id="productName" placeholder="Ürün Adı" data-i18n="prod_name_ph">
                <input type="text" id="productDesc" placeholder="Ürün Açıklaması" data-i18n="prod_desc_ph">
                <input type="text" id="productPrice" placeholder="Fiyat" data-i18n="prod_price_ph">
                <button class="btn btn-green" onclick="addProduct()" data-i18n="btn_add_prod">Ürün Ekle</button>
            </div>
            <div class="category-container" id="menuTabs"></div>
            <div style="display: flex; flex-direction: column; gap: 15px;" id="menuItemsGrid"></div>
        </div>

        <!-- ETKİNLİKLER SEKMESİ -->
        <div id="events" class="section">
            <div class="admin-only" id="adminEventControls">
                <h3 style="color: var(--vintage-red); margin-bottom: 15px;" data-i18n="admin_event_title">[Admin] Etkinlik Ekle</h3>
                <input type="text" id="eventName" placeholder="Sanatçı / Etkinlik Adı" data-i18n="event_name_ph">
                
                <div class="glass-item-card" onclick="openCustomDatePicker('eventDate', 'eventTime')" style="cursor:pointer; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5);">
                    <span id="eventDate_display" style="color:gray;" data-i18n="event_date_text">Etkinlik Tarih ve Saati Seçiniz</span>
                    <div style="display:flex; gap:10px;">
                        <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                        <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    </div>
                </div>
                <input type="hidden" id="eventDate">
                <input type="hidden" id="eventTime">
                <label style="color: var(--text-muted); font-size: 13px;" data-i18n="event_img_label">Etkinlik Fotoğrafı Yükle:</label>
                <input type="file" id="eventImage" accept="image/*" style="padding: 8px;">
                <button class="btn btn-primary" onclick="addEvent()" data-i18n="btn_add_event">Etkinlik Ata</button>
            </div>
            
            <h2 style="text-align: center; font-size: 32px; margin-bottom: 30px; letter-spacing: 1px;" data-i18n="title_calendar">Etkinlik Takvimi</h2>
            <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <!-- REZERVASYON SEKMESİ -->
        <div id="reservation" class="section">
            <div id="customerResView" class="glass-item-card" style="flex-direction: column; align-items: stretch; max-width: 600px; margin: 0 auto;">
                <h2 style="text-align:center; margin-bottom: 20px;" data-i18n="res_title">Rezervasyon Yap</h2>

    function formatEventDate(dateStr, timeStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-'); 
        if(parts.length !== 3) return timeStr ? `${dateStr} | ${timeStr}` : dateStr;
        
        const yil = parseInt(parts[0], 10);
        const ayIndex = parseInt(parts[1], 10) - 1;
        const gun = parseInt(parts[2], 10);
        
        const ay = aylarListesi[currentLang][ayIndex];
        const dateObj = new Date(yil, ayIndex, gun);
        const gunAdi = gunlerListesi[currentLang][dateObj.getDay()];
        
        if (timeStr) return `${gun} ${ay} ${gunAdi} ${yil} | ${timeStr.replace(':', '.')}`;
        else return `${gun} ${ay} ${gunAdi} ${yil}`;
    }

        document.getElementById('sysModalTitle').innerText = title;

    function closeSysModal(force) {

    let selectedPickerDate = "";
    function openCustomDatePicker(targetDateId, targetTimeId) {
        let html = `
            <div id="pickerGrid" class="calendar-grid" style="grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 20px;"></div>
            <input type="time" id="pickerTime" value="20:00" style="margin:0;">
        `;
        showSysModal("", html, [
            { text: "İptal", class: "btn-admin", onClick: () => closeSysModal(true) },
            { text: "Onayla", class: "btn-green", onClick: () => {
                let timeVal = document.getElementById('pickerTime').value;
                if(!selectedPickerDate || !timeVal) return;
                
                document.getElementById(targetDateId).value = selectedPickerDate;
                document.getElementById(targetTimeId).value = timeVal;
                document.getElementById(targetDateId + '_display').innerText = formatEventDate(selectedPickerDate, timeVal);
                document.getElementById(targetDateId + '_display').style.color = "white";
                
                if(targetDateId === 'resDate') checkEventForDate();
                closeSysModal(true);
            }}
        ]);

        const grid = document.getElementById('pickerGrid');
        const dObj = new Date();
        const year = dObj.getFullYear(), month = dObj.getMonth(), today = dObj.getDate();
        const daysInMonth = new Date(year, month + 1, 0).getDate(); 
        selectedPickerDate = "";

        for(let i = 1; i <= daysInMonth; i++) {
            let fullDate = `${year}-${(month + 1).toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
            let isPast = i < today;
            let div = document.createElement('div');
            div.className = 'cal-day';
            div.style = `aspect-ratio:1; display:flex; justify-content:center; align-items:center; font-size:15px; border-radius:10px; opacity:${isPast ? '0.3' : '1'}; cursor:${isPast ? 'not-allowed' : 'pointer'};`;
            div.innerText = i;
            if(!isPast) {
                div.onclick = () => {
                    document.querySelectorAll('#pickerGrid .cal-day').forEach(el => el.style.borderColor = 'transparent');
                    div.style.borderColor = 'var(--vintage-red)';
                    selectedPickerDate = fullDate;
                };
            }
            grid.appendChild(div);
        }
    }

            btn.className = `menu-tab ${cat === currentCategory ? 'active' : ''}`;
            btn.innerHTML = `${cat}`;
            if (isAdmin) btn.innerHTML += ` <span onclick="deleteCategory('${cat}'); event.stopPropagation();" style="margin-left:8px;"> ${iconDelete}</span>`;
            btn.onclick = () => { currentCategory = cat; renderMenu(); };
            tabsDiv.appendChild(btn);
        });

        const grid = document.getElementById('menuItemsGrid'); grid.innerHTML = '';
        db.products.filter(p => p.cat === currentCategory).forEach(p => {
            let price = p.price.trim(); if (!price.toUpperCase().endsWith('TL') && !price.endsWith('₺')) price += ' ₺';
            let adminHtml = isAdmin ? `<div style="display:flex; gap:10px; margin-top:12px;"><button class="btn btn-admin" style="padding:6px 12px;" onclick="editProduct(${p.id})"> ${iconEdit}</button><button class="btn btn-danger" style="padding:6px 12px;" onclick="deleteProduct(${p.id})"> ${iconDelete}</button></div>` : '';
            grid.innerHTML += `<div class="glass-item-card" style="align-items:flex-start;"><div style="flex:1;"><h3 style="font-size: 18px; color: var(--text-main);">${p.name}</h3><p style="font-size: 15px; color: gray ; margin-top:4px;">${p.desc}</p>${adminHtml}</div><div style="font-size: 18px; color: var(--text-main); margin-left: 20px; margin-top: 12px; white-space: nowrap;">${price}</div></div>`;
        });
        if(isAdmin) document.getElementById('categorySelect').innerHTML = db.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function addCategory() { let val = document.getElementById('newCategoryName').value.trim(); if(val && !db.categories.includes(val)) { db.categories.push(val); currentCategory = val; saveDB(); document.getElementById('newCategoryName').value = ''; renderMenu(); } }
    function deleteCategory(catName) { sysConfirm("Kategoriyi Silmek İster Misiniz?", () => { db.categories = db.categories.filter(c => c !== catName); db.products = db.products.filter(p => p.cat !== catName); if(currentCategory === catName) currentCategory = db.categories[0] || ''; saveDB(); renderMenu(); }); }
    function addProduct() { let cat = document.getElementById('categorySelect').value; let name = document.getElementById('productName').value.trim(), desc = document.getElementById('productDesc').value.trim(), price = document.getElementById('productPrice').value.trim(); if(name && price) { db.products.push({ id: Date.now(), cat, name, desc, price }); saveDB(); document.getElementById('productName').value=''; document.getElementById('productDesc').value=''; document.getElementById('productPrice').value=''; renderMenu(); } }
    function deleteProduct(id) { sysConfirm("Ürünü Silmek İster Misiniz?", () => { db.products = db.products.filter(p => p.id !== id); saveDB(); renderMenu(); }); }
    
    function editProduct(id) {
        let p = db.products.find(prod => prod.id === id); if(!p) return;
        let html = `<input type="text" id="editPName" value="${p.name}"><input type="text" id="editPDesc" value="${p.desc}"><input type="text" id="editPPrice" value="${p.price}">`;
        showSysModal("Edit", html, [{ text: "İptal", class: "btn-admin", onClick: () => closeSysModal(true) }, { text: "Onayla", class: "btn-green", onClick: () => { p.name = document.getElementById('editPName').value.trim(); p.desc = document.getElementById('editPDesc').value.trim(); p.price = document.getElementById('editPPrice').value.trim(); saveDB(); renderMenu(); closeSysModal(true); }}]);
    }

    function renderHome() {
        let today = new Date().toISOString().split('T')[0];
        const grid = document.getElementById('upcomingEventsGrid'); grid.innerHTML = '';
        let futureEvents = db.events.filter(e => e.date >= today).sort((a,b) => new Date(a.date) - new Date(b.date));
        
        if (futureEvents.length === 0) grid.innerHTML = `<p style="grid-column: 1/-1; width: 100%; text-align:center; color: gray;">${t('no_events')}</p>`;
        else futureEvents.forEach(ev => {
            let imgHtml = ev.img ? `<img src="${ev.img}" style="width:100%; height:150px; object-fit:cover; border-radius:10px; margin-bottom:15px;">` : '';
            grid.innerHTML += `<div class="event-card-home" onclick="openEventModal('${ev.id}')">${imgHtml}<h4 style="font-size: 18px;">${ev.name}</h4><p style="font-size: 14px; color: var(--text-muted); margin-top:5px;">${formatEventDate(ev.date, ev.time)}</p></div>`;
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
        const d = new Date(), year = d.getFullYear(), month = d.getMonth(), daysInMonth = new Date(year, month + 1, 0).getDate();
        for(let i = 1; i <= daysInMonth; i++) {
            let fullDate = `${year}-${(month + 1).toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
            let ev = db.events.find(e => e.date === fullDate);
            let bgStyle = ev && ev.img ? `background-image: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.3)), url('${ev.img}');` : '';
            grid.innerHTML += `<div class="cal-day" onclick="handleDayClick('${fullDate}', ${ev ? `'${ev.id}'` : null})"><div class="cal-bg" style="${bgStyle}"></div><div class="day-num">${i}</div>${ev ? `<div style="position:absolute; bottom:12px; left:8px; z-index:2; font-size:15px; color:var(--text-main); font-weight:bold;">${ev.name}</div>` : ''}</div>`;
        }
    }

    function addEvent() {
        let name = document.getElementById('eventName').value.trim(), date = document.getElementById('eventDate').value, time = document.getElementById('eventTime').value;
        let fileInput = document.getElementById('eventImage');
        if(!name || !date || !time) return;
        let evObj = { id: 'EV'+Date.now(), name, date, time, img: "" };
        if(fileInput.files && fileInput.files[0]) {
            let reader = new FileReader(); reader.onload = function(e) { evObj.img = e.target.result; db.events.push(evObj); saveDB(); renderAll(); }
            reader.readAsDataURL(fileInput.files[0]);
        } else { db.events.push(evObj); saveDB(); renderAll(); }
    }

    let selectedEventForRes = "";
    function handleDayClick(date, eventId) {
        if(eventId) openEventModal(eventId);
        else if(date >= new Date().toISOString().split('T')[0]) {
            showSection('reservation');
            document.getElementById('resDate').value = date;
            document.getElementById('resDate_display').innerText = formatEventDate(date, "");
            document.getElementById('resDate_display').style.color = "white";
            checkEventForDate();
        }
    }

    function openEventModal(eventId) {
        let ev = db.events.find(e => e.id === eventId); if(!ev) return;
        selectedEventForRes = ev.date;
        let imgHtml = ev.img ? `<img src="${ev.img}" style="width:100%; height:180px; object-fit:cover; border-radius:15px; margin-bottom:15px;">` : '';
        let bodyHtml = `${imgHtml}<p style="color:var(--text-muted); font-size:16px; margin-bottom:20px;">${formatEventDate(ev.date, ev.time)}</p>`;
        
        let btns = [
            { text: "İptal", class: "btn-admin", onClick: () => closeSysModal(true) }, 
            { text: "Rezervasyon Yap", class: "btn-green", onClick: () => { closeSysModal(true); showSection('reservation'); document.getElementById('resDate').value = ev.date; document.getElementById('resDate_display').innerText = formatEventDate(ev.date, ""); document.getElementById('resDate_display').style.color = "white"; checkEventForDate(); }}
        ];
        if(isAdmin) btns.push({ text: "Sil", class: "btn-danger", onClick: () => { closeSysModal(true); db.events = db.events.filter(e => e.id !== ev.id); saveDB(); renderAll(); } });
        showSysModal(ev.name, bodyHtml, btns);
    }

    // ETKİNLİK BALONUNU DOLDURMA
    function checkEventForDate() {
        let date = document.getElementById('resDate').value;
        let bubble = document.getElementById('resEventBubble');
        if(!date) { bubble.style.display = 'none'; return; }
        
        let ev = db.events.find(e => e.date === date);
        if(ev) {
            let imgHtml = ev.img ? `<img src="${ev.img}" style="width:50px; height:50px; border-radius:10px; object-fit:cover;">` : `<div style="width:50px; height:50px; border-radius:10px; background:#333; display:flex; align-items:center; justify-content:center; font-size:20px;">🎸</div>`;
            bubble.innerHTML = `${imgHtml}<div style="flex:1; text-align:left; display:flex; flex-direction:column; justify-content:center;"><h4 style="font-size:15px; margin-bottom:0; color:white;">${ev.name}</h4><span style="font-size:12px; color:var(--text-muted);">${formatEventDate(ev.date, ev.time)}</span></div>`;
            bubble.style.display = 'flex';
        } else {
            bubble.innerHTML = `<div style="width:100%; text-align:center; font-size:14px; color:gray;">${t('no_event_day')}</div>`;
            bubble.style.display = 'flex';
        }
    }

    function submitReservation() {
        let name = document.getElementById('resName').value.trim();
        let phone = document.getElementById('resPhone').value.trim();
        let date = document.getElementById('resDate').value;
        let time = document.getElementById('resTime').value;
        let people = document.getElementById('resPeople').value;
        let note = document.getElementById('resNote').value.trim();
        
        // Boş alan kontrolü ve dil bazlı uyarı
        if(!name || !phone || !date || !time) {
            let errorMsg = currentLang === 'en' ? "Please fill in all required fields." : 
                           currentLang === 'bg' ? "Моля, попълнете всички задължителни полета." : 
                           "Lütfen tüm zorunlu alanları doldurunuz.";
            sysAlert(errorMsg);
            return;
        }

        let eventDetail = db.events.find(e => e.date === date)?.name || '-';
        db.reservations.push({ id: Date.now(), name, phone, date, time, eventDetail, people, note, status: 'pending' }); 
        saveDB(); 
        
        // Başarı mesajı (Seçili dile göre otomatik değişir)
        let successMsg = currentLang === 'en' ? "Your request has been successfully received. We will contact you shortly." : 
                         currentLang === 'bg' ? "Вашата заявка е получена успешно. Ще се свържем с вас скоро." : 
                         "Talebiniz başarıyla alındı. Tarafınıza dönüş sağlanacaktır.";

        // Başarı Pop-up'ı ve ardından formu temizleme
        sysAlert(successMsg, () => {
            document.getElementById('resName').value = ''; 
            document.getElementById('resPhone').value = ''; 
            document.getElementById('resDate').value = ''; 
            document.getElementById('resTime').value = '';
            document.getElementById('resNote').value = '';
            document.getElementById('resDate_display').innerText = t('res_date_text'); 
            document.getElementById('resDate_display').style.color = 'gray'; 
            document.getElementById('resEventBubble').style.display = 'none';
            
            // Kişiyi Varsayılana (2) döndür
            selectPeople('2', document.querySelectorAll('.ppl-btn')[1]);
        });
    }

    function renderAdminReservations() {
        let pending = document.getElementById('pendingReservations'); let approved = document.getElementById('approvedReservations');
        pending.replaceChildren(); approved.replaceChildren();
        db.reservations.forEach(r => {
            if (r.status !== 'pending' && r.status !== 'approved') return;
            const card = document.createElement('div');
            card.className = 'glass-item-card';
            card.style.cssText = 'flex-direction:column; align-items:flex-start;';
            const text = (tag, value, style) => {
                const element = document.createElement(tag);
                element.textContent = String(value ?? '');
                element.style.cssText = style;
                card.appendChild(element);
            };
            text('h4', r.name, 'font-size:18px;');
            text('p', `Tel: ${r.phone}`, 'font-size:14px; color:var(--text-muted); margin-top:5px;');
            text('p', `Tarih: ${formatEventDate(r.date, r.time)}`, 'font-size:14px; color:var(--text-muted);');
            text('p', `${t('admin_people')}: ${r.people || '2'} | Etkinlik: ${r.eventDetail}`, 'font-size:14px; color:var(--text-muted);');
            if (r.note) text('p', `${t('admin_note')}: ${r.note}`, 'font-size:14px; color:#ffaaaa;');
            const action = (container, label, className, style, callback) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = className;
                button.style.cssText = style;
                button.textContent = label;
                button.addEventListener('click', callback);
                container.appendChild(button);
            };
            if (r.status === 'pending') {
                const buttons = document.createElement('div');
                buttons.style.cssText = 'margin-top:15px; display:flex; gap:10px; width:100%;';
                action(buttons, 'Onayla', 'btn btn-green', 'flex:1;', () => approveRes(r.id));
                action(buttons, 'Reddet', 'btn btn-danger', 'flex:1;', () => rejectRes(r.id));
                card.appendChild(buttons);
                pending.appendChild(card);
            } else {
                action(card, 'Sil', 'btn btn-danger', 'margin-top:15px; width:100%;', () => deleteApprovedRes(r.id));
                approved.appendChild(card);
            }
        });
    }

   function approveRes(id) { 
        let res = db.reservations.find(r => r.id===id); 
        if(res){ res.status='approved'; saveDB(); renderAdminReservations(); } 
    }
    
    function deleteApprovedRes(id) { 
        sysConfirm("Onaylanmış bu masayı silmek istediğinize emin misiniz?", () => { 
            db.reservations = db.reservations.filter(r => r.id !== id); 
            saveDB(); 
            renderAdminReservations(); 
        }); 
    }
    
    function rejectRes(id) { 
        sysConfirm("Bu rezervasyonu reddetmek istiyor musunuz?", () => { 
            db.reservations = db.reservations.filter(r => r.id !== id); 
            saveDB(); 
            renderAdminReservations(); 
        }); 
    }

    renderAll();
</script>
</body>
</html>
